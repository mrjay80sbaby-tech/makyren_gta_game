services:
  # 1. Multiplayer Socket Server (Backend)
  - type: web
    name: gta-server
    env: node
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 10000

  # 2. 3D WebGL Game App (Frontend)
  - type: web
    name: gta-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html