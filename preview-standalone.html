ength)],roughness:.62,metalness:.12}));b.position.set(x,h/2,z);b.castShadow=b.receiveShadow=true;S.add(b)}const p=new T.Group();const body=new T.Mesh(new T.CapsuleGeometry(.62,1.15,8,16),new T.MeshStandardMaterial({color:0x111722,roughness:.5}));body.position.y=2.1;body.castShadow=true;p.add(body);const head=new T.Mesh(new T.SphereGeometry(.49,24,16),new T.MeshStandardMaterial({color:0x9a6549,roughness:.6}));head.position.y=3.38;p.add(head);S.add(p);const cars=[];for(let i=0;i<14;i++){const g=new T.Group(),m=new T.MeshStandardMaterial({color:[0x0d5c8b,0x8c2020,0xd3b84b,0xdddddd,0x101010][i%5],metalness:.6,roughness:.3});const b=new T.Mesh(new T.BoxGeometry(2.1,.65,4.3),m);b.position.y=.72;g.add(b);const cab=new T.Mesh(new T.BoxGeometry(1.7,.65,2.1),new T.MeshStandardMaterial({color:0x111a22,roughness:.1}));cab.position.y=1.25;g.add(cab);g.position.set((Math.random()-.5)*300,0,(Math.random()-.5)*300);g.userData.v=4+Math.random()*4;S.add(g);cars.push(g)}function loop(){requestAnimationFrame(loop);for(const v of cars){v.translateZ(-v.userData.v*.016);if(v.position.z<-180)v.position.z=180}C.lookAt(p.position.x,p.position.y+2,p.position.z);R.render(S,C)}loop();document.getElementById('status').textContent="MA'KYREN CITY — PREVIEW";setTimeout(()=>document.getElementById('status').remove(),1800);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})})()</script></body></html>
