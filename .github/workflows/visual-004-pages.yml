name: MA'KYREN Visual-004 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: visual-004/package.json
      - name: Validate browser JavaScript syntax
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check visual-004/src/main.js
      - name: Install and build visual-004
        working-directory: visual-004
        run: npm install && npm run build
      - name: Assemble Pages site
        run: |
          mkdir -p _site/visual-004
          cp -R visual-004/dist/. _site/visual-004/
          cp -R .nojekyll _site/.nojekyll 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4