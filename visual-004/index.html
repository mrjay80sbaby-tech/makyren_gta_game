<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MA'KYREN — Visual 004</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151a}#renderCanvas{width:100%;height:100%;touch-action:none;display:block}#boot-status{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:#000c;padding:10px 14px;border:1px solid #ffffff33;border-radius:10px;font:600 13px system-ui;white-space:nowrap}#boot-error{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:#3a0d0d;color:#ffd7d7;padding:10px 12px;border:1px solid #ff8888;border-radius:10px;font:600 12px/1.5 system-ui;white-space:pre-wrap;word-break:break-word}#hud{position:fixed;z-index:5;left:calc(12px + env(safe-area-inset-left, 0px));top:calc(12px + env(safe-area-inset-top, 0px));color:#fff;background:#0009;padding:10px 12px;border:1px solid #ffffff22;border-radius:10px;font:600 13px system-ui}</style></head><body><div id="hud">MA'KYREN • VISUAL-004<br><small>Local engine build • asset pipeline active</small></div><canvas id="renderCanvas"></canvas><div id="boot-status">Loading Ma'Kyren&hellip;</div><script>window.addEventListener('error',function(e){var d=document.getElementById('boot-error');if(!d){d=document.createElement('div');d.id='boot-error';document.body.appendChild(d);}d.textContent='Boot error: '+(e.message||e.type);});window.addEventListener('unhandledrejection',function(e){var r=e.reason;window.dispatchEvent(new ErrorEvent('error',{message:String(r&&r.message||r)}));});</script><script type="module" src="./src/main.js"></script><script type="module" src="./src/traffic_system.js"></script></body></html>
